name: Publish A8xx test APK

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release-a8xx.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a8xx-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure build
        run: |
          chmod +x gradlew tools/fetch_components.sh
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Fetch verified runtime components
        run: tools/fetch_components.sh

      - name: Build release APK
        run: ./gradlew assembleModernRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/modern/release/*.apk dist/WoW-Forever-A8xx-v2.1.0-test.apk
          sha256sum dist/WoW-Forever-A8xx-v2.1.0-test.apk > dist/SHA256SUMS.txt

      - name: Publish prerelease
        run: |
          TAG="v2.1.0-a8xx-test"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/*               --repo "$GITHUB_REPOSITORY"               --title "WoW Forever A8xx v2.1.0 test"               --prerelease               --notes "SteamFlow test build focused on Adreno 830 and Adreno 840. Uses the patched Gen8 Turnip V32 RP6sched profile, 1280x720 default, and TU_DEBUG=noconform,sysmem. Adreno 740 users should use Jared's upstream project."
          fi
